<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ひなちゃんへ</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background: linear-gradient(160deg, #fdf6ec 0%, #fdeef2 55%, #f9e3ec 100%);
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
    color: #4a3f3a;
  }
  .card {
    background: #fffdfa;
    width: 100%;
    max-width: 420px;
    border-radius: 20px;
    padding: 40px 30px 34px;
    box-shadow: 0 12px 40px rgba(190, 130, 150, 0.22);
  }
  .heart {
    text-align: center;
    font-size: 30px;
    margin-bottom: 14px;
  }
  h1 {
    font-size: 21px;
    text-align: center;
    letter-spacing: 0.08em;
    margin-bottom: 28px;
    color: #5a463f;
  }
  .letter {
    font-size: 16.5px;
    line-height: 2.1;
    letter-spacing: 0.03em;
    white-space: pre-line;
  }
  .from {
    margin-top: 30px;
    text-align: right;
    font-size: 16px;
    letter-spacing: 0.05em;
  }
  .music {
    margin-top: 36px;
    text-align: center;
  }
  .music .song {
    font-size: 14.5px;
    letter-spacing: 0.05em;
    color: #8a6f66;
    margin-bottom: 12px;
  }
  .music .player {
    position: relative;
    width: 100%;
    padding-top: 56.25%;
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 16px;
    background: #000;
  }
  .music .player iframe {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
  }
  .music a {
    display: inline-block;
    background: #e86a8a;
    color: #fff;
    text-decoration: none;
    font-size: 15.5px;
    font-weight: bold;
    letter-spacing: 0.06em;
    padding: 14px 34px;
    border-radius: 999px;
    box-shadow: 0 6px 18px rgba(232, 106, 138, 0.35);
  }
  .music a:active { transform: scale(0.97); }
  .music .note {
    margin-top: 10px;
    font-size: 12px;
    color: #a08b84;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="heart">💌</div>
    <h1>ひなちゃんへ</h1>
    <div class="letter">5ヶ月ありがとうね
いっぱい嫌な思いさせてほんとにごめん
大好きです

感謝してます</div>
    <div class="from">しゅんたより</div>
    <div class="music">
      <div class="song">♪ 坂本龍一「Aqua」</div>
      <div class="player">
        <iframe src="https://www.youtube-nocookie.com/embed/CGK6jZPMEcA" title="坂本龍一 - Aqua" frameborder="0" allow="accelerometer; autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
      </div>
      <a href="https://www.youtube.com/watch?v=CGK6jZPMEcA">YouTubeで聴く</a>
      <div class="note">曲はあとから変更できます</div>
    </div>
  </div>
</body>
</html>
