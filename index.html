<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ひなちゃんへ</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background: linear-gradient(160deg, #fdf6ec 0%, #fdeef2 55%, #f9e3ec 100%);
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
    color: #4a3f3a;
  }
  .card {
    background: #fffdfa;
    width: 100%;
    max-width: 420px;
    border-radius: 20px;
    padding: 40px 30px 34px;
    box-shadow: 0 12px 40px rgba(190, 130, 150, 0.22);
    position: relative;
    overflow: hidden;
  }
  /* 封筒カバー */
  #cover {
    position: absolute;
    inset: 0;
    background: #fffdfa;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    cursor: pointer;
    z-index: 10;
    transition: opacity 0.9s ease;
    -webkit-tap-highlight-color: transparent;
  }
  #cover.opened {
    opacity: 0;
    pointer-events: none;
  }
  #cover .env { font-size: 64px; }
  #cover .to {
    font-size: 20px;
    letter-spacing: 0.1em;
    color: #5a463f;
  }
  #cover .tap {
    font-size: 13.5px;
    color: #b08d84;
    letter-spacing: 0.08em;
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.45; }
    50% { opacity: 1; }
  }
  h1 {
    font-size: 21px;
    text-align: center;
    letter-spacing: 0.08em;
    margin-bottom: 28px;
    color: #5a463f;
  }
  .heart {
    text-align: center;
    font-size: 30px;
    margin-bottom: 14px;
  }
  .letter {
    font-size: 16.5px;
    line-height: 2.1;
    letter-spacing: 0.03em;
    white-space: pre-line;
  }
  .from {
    margin-top: 30px;
    text-align: right;
    font-size: 16px;
    letter-spacing: 0.05em;
  }
  .music {
    margin-top: 36px;
    text-align: center;
  }
  .music .song {
    font-size: 14px;
    letter-spacing: 0.05em;
    color: #8a6f66;
    margin-bottom: 10px;
  }
  .music .player {
    position: relative;
    width: 100%;
    padding-top: 56.25%;
    border-radius: 12px;
    overflow: hidden;
    background: #000;
  }
  .music .player iframe,
  .music .player > div {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
  }
  .music .note {
    margin-top: 10px;
    font-size: 12px;
    color: #a08b84;
  }
</style>
</head>
<body>
  <div class="card">
    <div id="cover">
      <div class="env">💌</div>
      <div class="to">ひなちゃんへ</div>
      <div class="tap">タップして開く</div>
    </div>

    <div class="heart">💌</div>
    <h1>ひなちゃんへ</h1>
    <div class="letter">5ヶ月ありがとうね
いっぱい嫌な思いさせてほんとにごめん
大好きです

感謝してます</div>
    <div class="from">しゅんたより</div>

    <div class="music">
      <div class="song">♪ 坂本龍一「Aqua」</div>
      <div class="player"><div id="ytplayer"></div></div>
      <div class="note">開くと音楽が流れます</div>
    </div>
  </div>

  <script>
    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    var player;
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('ytplayer', {
        videoId: 'd19hYwxk5vQ',
        playerVars: { playsinline: 1, rel: 0 }
      });
    }

    document.getElementById('cover').addEventListener('click', function () {
      this.classList.add('opened');
      if (player && player.playVideo) {
        player.playVideo();
      }
    });
  </script>
</body>
</html>
